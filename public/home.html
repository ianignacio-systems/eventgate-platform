<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Event registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F2F2F2; --ink: #141414; --muted: #5C5C5C; --red: #E00000; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 400 16px/1.55 Roboto, "Helvetica Neue", Arial, sans-serif; padding: 24px 16px; }
  main { max-width: 520px; background: #fff; border-radius: 16px; border-top: 6px solid var(--red); padding: 36px 32px; }
  h1 { font-size: 1.9rem; line-height: 1.1; margin: 0 0 12px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .powered { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 24px; }
  .powered img { height: 24px; width: auto; display: block; }
</style>
</head>
<body>
<main>
  <h1>Event registration</h1>
  <p>Looking for an event? Open the registration link in your invitation. Each event has its own page.</p>
  <p>Organizing an event? Contact Jupiter Systems, Inc. to run your registration and check-in here.</p>
  <footer class="powered"><span>Powered by</span><img src="/jupiter-logo.png" alt="Jupiter Systems, Inc." width="76" height="24"></footer>
</main>
</body>
</html>
